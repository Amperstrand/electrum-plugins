[pytest]
# Pytest configuration for CLTV E2E tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output formatting
console_output_style = progress
addopts = 
    -v
    -s
    --tb=short
    --strict-markers
    -ra
    --show-capture=no

# Markers for test organization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    e2e: marks end-to-end tests that interact with testnet4
    p2sh: marks P2SH-specific tests
    p2wsh: marks P2WSH-specific tests (SegWit v0)
    taproot: marks Taproot-specific tests
    integration: marks integration tests requiring external services
    functional: marks functional tests requiring Electrum daemon
    edge_cases: marks edge case and boundary condition tests
    performance: marks performance/benchmark tests
    unit: marks unit tests for isolated components

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test execution
testpaths = .
