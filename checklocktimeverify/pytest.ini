[tool.pytest.ini]
# Pytest configuration for CLTV Plugin test suite

# Test discovery patterns
python_files = tests/**/*.py
python_classes = Test*

# Test markers (for running specific test categories)
markers =
    # Unit tests - fast, isolated component tests
    unit: Unit tests for individual components
    slow: Marks slow-running tests
    integration: Integration tests (require Electrum wallet)
    e2e: End-to-end tests (require blockchain)
    requires_network: Tests that require network connection
    requires_wallet: Tests that require wallet infrastructure
    
    # Organization markers
    storage: Tests related to storage operations
    wallet: Tests related to wallet integration
    validation: Tests related to validation logic
    builders: Tests related to contract/address building
    sweepers: Tests related to sweeping operations

# Coverage configuration
[coverage:run]
source = .
omit =
    */tests/*
    */__pycache__/*
    */venv/*
    */site-packages/*
    
    # Test files are excluded from coverage
    tests/*/test_*.py
    
# Pytest options
addopts =
    # Detailed test output
    -v
    # Show local variables
    -l
    # Show print statements in tests
    -s
    # Short trace on first failure
    --tb=short
    # Color output
    --color=yes
    # Warnings
    -W ignore::PendingDeprecationWarning
    
    # Minimum Python version
    minversion = 3.8
    
    # Use strict mode
    strict = true
    
    # Enable doctest integration
    doctest-modules = cltv_lib

# Logging during tests
log_cli = false
log_cli_level = INFO

# Test output
testpaths = tests